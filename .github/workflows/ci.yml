# Lightweight checks on every PR, on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Required files
        run: |
          for f in README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$f" || { echo "::error file=$f::$f is missing"; exit 1; }
          done

      # Scanned before `npm ci` so that node_modules is not included.
      - name: Secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --no-banner --redact

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax
        run: git ls-files '*.js' | grep -v '\.min\.js$' | xargs -r -n1 node --check

      - name: Server modules load
        # Requires every server-side module without starting the server or connecting to MongoDB.
        run: node -e "for (const f of ['./database/db', './model/adminModel', './model/allUser', './model/histoyModel', './router/index']) require(f)"
